[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "event-marketing-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "SQLAlchemy==2.1.3",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "pydantic-settings==2.15.0",
  "Authlib==1.8.0", "httpx2==2.13.1", "joserfc==1.7.5", "cryptography==50.0.2", "openai==3.24.0",
  "Pillow==12.3.0", "pypdf==6.19.0", "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
