services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_USER: emp_local
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: emp_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - emp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emp_local -d emp_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  emp_postgres:
